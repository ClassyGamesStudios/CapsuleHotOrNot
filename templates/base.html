<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GameDev Portal{% endblock %}</title>
    <style>
        :root {
            --primary: #00b4d8;
            --accent: #22d3ee;
            --bg: #0f172a;
            --card: #1e2937;
            --text: #e2e8f0;
            --muted: #94a3b8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e2937 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 1100px; margin: 0 auto; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            flex-wrap: wrap;
            gap: 12px;
        }
        h1 { font-size: 2.4rem; }
        a.link { color: var(--primary); text-decoration: none; font-weight: 600; }
        a.link:hover { color: var(--accent); }
        .btn {
            display: inline-block;
            padding: 12px 26px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 9999px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: 0.25s;
        }
        .btn:hover { background: var(--accent); transform: translateY(-2px); }
        input[type="text"] {
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            background: #334155;
            color: #fff;
            font-size: 1.1rem;
        }
        .flash {
            background: rgba(34, 211, 238, 0.12);
            border: 1px solid rgba(34, 211, 238, 0.4);
            color: var(--accent);
            padding: 12px 18px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for msg in messages %}
                    <div class="flash">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
